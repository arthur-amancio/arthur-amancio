<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Arthur Amancio Francisco</title>
  <desc id="desc">Desenvolvimento de Software, Java, Spring Boot e PostgreSQL</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071426"/>
      <stop offset="55%" stop-color="#0b2748"/>
      <stop offset="100%" stop-color="#0d4d70"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="1040" cy="55" r="150" fill="#0ea5e9" opacity=".12"/>
  <circle cx="1110" cy="245" r="120" fill="#22d3ee" opacity=".08"/>
  <circle cx="170" cy="280" r="120" fill="#38bdf8" opacity=".07"/>

  <g stroke="#38bdf8" stroke-width="2" opacity=".18" fill="none">
    <path d="M30 70 H170 L210 110 H350"/>
    <path d="M850 245 H1010 L1050 205 H1170"/>
    <path d="M930 30 V85 L980 135"/>
    <circle cx="170" cy="70" r="5" fill="#38bdf8"/>
    <circle cx="1050" cy="205" r="5" fill="#22d3ee"/>
  </g>

  <rect x="74" y="58" width="8" height="184" rx="4" fill="url(#accent)"/>
  <rect x="104" y="76" width="520" height="110" rx="18" fill="#38bdf8" opacity=".05" filter="url(#glow)"/>

  <text x="118" y="126" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing=".3">
    Arthur Amancio Francisco
  </text>
  <text x="120" y="174" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">
    Desenvolvimento de Software
  </text>
  <text x="120" y="214" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="20">
    Java • Spring Boot • PostgreSQL • Suporte e Infraestrutura
  </text>

  <g transform="translate(1000 125)" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-52 -38 L-88 0 L-52 38"/>
    <path d="M52 -38 L88 0 L52 38"/>
    <path d="M18 -58 L-18 58"/>
  </g>
</svg>
